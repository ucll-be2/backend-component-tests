info:
  name: Create new movie
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/movies"
  body:
    type: json
    data: |-
      {
        "title": "Apocalypse Now",
        "director": "Francis Ford Coppola",
        "year": 1979
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
