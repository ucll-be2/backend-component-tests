info:
  name: Delete actor with ID {{actorId}}
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/actors/:actorId"
  params:
    - name: actorId
      value: "{{actorId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
